name: Validate Social Studio
on:
  pull_request:
    branches: [main, feat/auth-live-supabase]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/boot.js
          node --check dist/auth-recovery.js
          node --check dist/client-portal.js
          node --check api/public-config.js
      - name: Test client isolation at UI boundary
        run: node --test tests/client-portal.test.cjs tests/password-recovery.test.cjs
