name: Verify client isolation (Supabase RLS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    name: Two-client Postgres RLS contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fixed Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start fresh LOCAL database and apply migrations
        run: supabase db start
      - name: Execute 22 pgTAP assertions under client A, client B, agency and anon
        run: supabase test db
